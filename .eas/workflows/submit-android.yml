name: Android - Build and Submit

# CD adiado: sem `on`, o EAS não dispara este workflow no push.
# Quando formos publicar de verdade, descomentar:
# on:
#   push:
#     branches: ["main"]
# Até lá, rodar manualmente com:
# eas workflow:run .eas/workflows/submit-android.yml

jobs:
  build_android:
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
    env:
      EXPO_DEBUG: "1"
