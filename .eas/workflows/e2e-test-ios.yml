name: e2e-test-ios

# E2E adiado: sem `on`, o EAS não dispara este workflow.
# Os fluxos em maestro/ foram ajustados no Android. Valide no
# simulador antes de descomentar o pull request:
# on:
#   pull_request:
#     branches: ["*"]
# O comando manual ainda gera a build e executa o Maestro:
# eas workflow:run .eas/workflows/e2e-test-ios.yml

jobs:
  build_ios_for_e2e:
    type: build
    params:
      platform: ios
      profile: maestro # your eas build profile for E2E test

  maestro_test:
    needs: [build_ios_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_for_e2e.outputs.build_id }}
      flow_path: ["maestro/auth.yml", "maestro/edit-profile.yml"]
