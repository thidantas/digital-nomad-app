appId: com.thiagolabs.digitalnomadapp
---
- launchApp:
    clearState: true

- runFlow: sign-in.yml

- tapOn:
    text: .*Perfil.*
- tapOn:
    text: .*Editar perfil.*

- tapOn:
    id: fullname-input

- eraseText: 100
- inputText: "Maestro Name"

- tapOn: .*Atualizar Perfil.*

- tapOn:
    id: submit-button

- assertVisible: ".*perfil atualizado.*"
- assertVisible: ".*Maestro Name*"
